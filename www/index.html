<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#1f3a2a;color:#f3e7c9}

.mi{background:var(--card);border:1px solid #c9a24a66;border-radius:12px;padding:14px;text-align:left;color:var(--ink);font:inherit;cursor:pointer;box-shadow:0 2px 6px #0002}
.mi span{font-size:26px;display:block}.mi b{display:block;margin-top:4px}.mi small{color:var(--mut)}
.cv{width:100%;height:100%;background:linear-gradient(145deg,#24452f,#10241a);border:3px double var(--gold);color:#f3e7c9;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:6%;font-size:clamp(11px,3.4vw,16px);box-shadow:inset 6px 0 12px #0008}
.cv svg{width:80%}.cv h1{font-size:2.1em;line-height:1.05;margin:.3em 0;color:var(--gold);font-variant:small-caps}

.bw{flex:1;min-height:0;display:flex;justify-content:center;padding:12px 10px;perspective:1800px;overflow:hidden}
#bk{position:relative;width:min(100%,480px);height:100%;touch-action:pan-y;user-select:none}
.lf{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.5,.1,.2,1);filter:drop-shadow(-3px 3px 6px #0004)}
.f,.b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:2px 8px 8px 2px;overflow:hidden}

.pp h2{margin:0 0 8px;color:var(--acc);font-size:1.25em}.pp p{margin:.5em 0;text-align:justify;hyphens:auto}

.pp a{display:block;padding:4px 0;border-bottom:1px dotted #8a6;cursor:pointer;color:var(--ink)}
.bar{display:flex;justify-content:center;align-items:center;gap:18px;padding:8px;color:var(--mut)}
.bar button{font-size:22px;background:var(--card);color:var(--ink);border:1px solid #c9a24a88;border-radius:50%;width:42px;height:42px;cursor:pointer}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chips button{padding:6px 12px;border-radius:99px;border:1px solid var(--gold);background:var(--card);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.chips button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.c{display:flex;gap:12px;background:var(--card);border-radius:12px;padding:12px;margin-bottom:10px;border-left:4px solid var(--gold);box-shadow:0 1px 4px #0002}

.c h3{margin:0;font-size:17px}.c em{color:var(--acc);font-size:13px;display:block}.c p{margin:.3em 0 0;font-size:15px}
.tl{border-left:2px solid var(--gold);margin-left:8px;padding-left:14px}.tl div{margin-bottom:12px}.tl b{color:var(--acc)}
h2.t{margin:4px 0 12px;color:var(--acc)}
.ci{width:100%;height:100%;object-fit:contain;display:block}
.gal{columns:2;gap:10px}.gal figure{margin:0 0 10px;break-inside:avoid;background:var(--card);border:1px solid #c9a24a66;border-radius:8px;overflow:hidden;cursor:pointer}
.gal img{width:100%;display:block}.gal figcaption{padding:6px 8px;font-size:12px;color:var(--mut);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#lb{position:fixed;inset:0;background:#000d;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:10px;color:#f3e7c9;text-align:center}
#lb img{max-width:100%;max-height:62%;object-fit:contain;border-radius:4px}#lb p{max-width:520px;margin:0;font-size:15px}
#lb div{display:flex;gap:16px}#lb button{font-size:24px;background:#24452f;color:#f3e7c9;border:1px solid var(--gold);border-radius:50%;width:46px;height:46px}
#sp{position:fixed;inset:0;z-index:20;background:#10241a;display:flex;align-items:center;justify-content:center;transition:opacity .6s}#sp img{max-width:100%;max-height:100%;object-fit:contain}
</style></head><body>
<header><button id="bb" onclick="home()" aria-label="Volver" hidden>←</button><b id="ttl">Historia de La Purísima</b></header>
<main id="v"></main>
<script>
const $=s=>document.querySelector(s),R=a=>a.map(x=>x.split('|'));
const covIn='<img class=ci src="cover.jpg" alt="Portada">';const cov=`<div class=cv style="padding:0;display:block;background:#10241a;border:0">${covIn}</div>`;
const PG=R(['Introducción|Cada familia y comunidad guarda una memoria que pasa de voz en voz. Este libro recoge esa tradición oral y la deja por escrito: la historia de La Purísima, su fundación y sus fundadores, y el recorrido de la familia Terrazas y su parentela durante dos siglos de lucha, supervivencia y trabajo.',
'I. Pedro Escobedo, Querétaro|Municipio del sur queretano, a 1,950 msnm, con 291 km² y unos 64 mil habitantes en 80 localidades. La Purísima es su última comunidad al poniente, a 20 km de la capital del estado y colindante con Huimilpan. Se cultiva maíz, frijol, calabaza y alfalfa; la fiesta patronal es el 8 de diciembre.',
'II. Antecedentes prehispánicos|Donde hoy está la comunidad hubo un asentamiento antiguo, quizá tolteca: piedras labradas, un montículo piramidal, una laja con perforaciones que parece un mapa y una cueva con pinturas de venados, soles y espirales. Abundan tepalcates, metates y puntas de obsidiana.',
'El Potrero de San Aparicio|Por el camino de Querétaro a Huimilpan pasaban arrieros y soldados. En el Potrero vivió el fraile franciscano Aparicio, que curaba y alimentaba a soldados pobres de ambos bandos. Más tarde, en tiempos de epidemia, se abrió ahí un panteón provisional.',
'Fundación de La Purísima|El 20 de mayo de 1947 llegó Herculano Terrazas Sánchez con su esposa Ana Espinoza Barrón y sus hijos: la primera familia. Siguieron otras once, hasta formar 12 hogares con 13 mujeres, 12 hombres y 16 niños. Cargaban agua del río a lomo de burro, desde 3 km de distancia.',
'La vida en comunidad|La fiebre aftosa obligó a sacrificar el ganado de la región. Poco a poco llegaron la escuela (1967), la capilla, el molino, el tractor y la luz eléctrica (1984). Los acuerdos se hacían “a la palabra”, y el pueblo reservó terreno para cancha, clínica, jardín de niños y plaza.',
'Las primeras veces|Primera casa (1947), primeras gemelas (1967), primera misa (1971), primer molino de nixtamal (1977), primer tractor y primera camioneta (1982). En 1968 se reconoció el nombre de La Purísima.',
'Fundadores y calles|Entre 2012 y 2015, siendo subdelegado Saúl Tovar Terrazas, una asamblea aprobó con 80% de los votos dar a las calles los nombres de los fundadores. La calle principal, antes vereda de los bordos, lleva el nombre de Antonio Terrazas.',
'IV. La trascendencia de la familia|Vicente Terrazas nació en 1820 en Tarjeas, Celaya, y se casó hacia 1841 con Bartola Salinas. Vivieron en Ajuchitlancito, donde Vicente era vaquero de la hacienda; murió en 1868 a manos de un bandido. Su nieto Herculano nació en 1895.',
'El enfrentamiento contra los bandidos|Hacia 1917 la banda de Francisco “Pancho” Tinajero, de unos 30 hombres, amenazó a los Terrazas del Cerro del Meco. La familia compró armas, practicó tiro y preparó una emboscada nocturna en un cañón. Los bandidos huyeron en desorden y poco después la epidemia de 1918 los acabó.',
'Lucha por la tierra y cristeros|Tras la Revolución, el reparto agrario dio origen a los ejidos. Hacia 1935 hubo enfrentamientos entre agraristas, que recibían tierra, y los llamados cristeros, armados según el autor por hacendados y clero. Macedonio León Maya, agrarista, fue asesinado y su hijo Isidro desaparecido.',
'Mi abuelo en la Revolución|En 1915 Macedonio fue reclutado por la leva carrancista. El teniente Pancracio, de buen corazón, lo puso a domar caballos y luego lo liberó para que “peleara por la patria cultivando la tierra”. Su viuda, María Concepción, fue una mujer luchona y comerciante.',
'Parentela Olvera y personaje ilustre|El libro sigue la familia de Ma. del Carmen Olvera Maya, esposa del autor, y rinde homenaje a Benito Bocanegra Osornio (1903–1955), líder agrario y presidente municipal de Pedro Escobedo, asesinado el 1 de noviembre de 1955.',
'Apéndices|Incluye el acta de dotación y deslinde del Ejido de Escolásticas (1,298 hectáreas), un álbum fotográfico y la bibliografía. Obra del Subtte. Cond. Ret. Agustín Terrazas León, historiador de La Purísima.']);
const BI=R(['Vicente Terrazas|Tatarabuelo del autor|1820–1868|Nació en Tarjeas, Celaya. Casado con Bartola Salinas, vivió en Ajuchitlancito como vaquero de hacienda. Murió herido por un bandido que quería robar el ganado.|F',
'Bartola Salinas|Tatarabuela|c. 1822|De Huimilpan. Guardaba monedas de oro en tinajas y tenía mucho ganado; pudo comprar una hacienda por 10,000 pesos oro, pero prefirió no gastar.|F',
'Alfonso Terrazas Salinas|Bisabuelo, músico y poeta|† 1947|Tocaba el violín, hablaba en refranes y lo contrataban para pedir novias. Encabezó la defensa familiar contra Tinajero. Murió a los 105 años.|F',
'Ana Cleta Sánchez|Bisabuela|† a los 86|De La Cuesta, Huimilpan, muy católica. Alfonso la cruzó cargada por el río crecido para llevarla a casa. Madre de Herculano.|F',
'Víctor Terrazas Salinas|Tío abuelo|—|Decidido y explosivo. Venció a dos asaltantes en el camino real y dio con el asesino de su padre Vicente.|F',
'Estefana Terrazas Sánchez|Tía abuela|—|Los bandidos la ataron con una soga para sacarle el secreto del dinero; ella fingía ahogarse mientras la soga ni se tensaba.|F',
'Herculano Terrazas Sánchez|Abuelo paterno y primer poblador|n. 1895|Llegó el 20 de mayo de 1947 al Potrero con su familia. La puerta de su primera casa, hecha en 1938, aún se conserva.|P',
'Ana Espinoza Barrón|Abuela paterna|—|De Carranza, Huimilpan. Al perder a un hijo dijo que Dios se encargaría del culpable: “siempre será mejor la paz”.|F',
'Antonio Terrazas Espinoza|Fundador, tío del autor|1922–2017|Nació y murió un 6 de enero, a los 95 años. La calle principal de la comunidad lleva su nombre. Esposo de Celerina Flores Zamudio.|P',
'Agustín Terrazas Espinoza|Padre del autor|—|Primer subdelegado con credencial (1968), instaló el molino de nixtamal y compró el primer tractor. Soñaba con ser militar. Se casó a los 19 años.|P',
'María Luisa León Morales|Madre del autor|—|Se casó a los 15 años y tuvo doce hijos. Atendía una tienda bien surtida y traía mercancía de Querétaro en burro.|F',
'María Concepción Morales Lara|Abuela materna|† 1982|Luchona y comerciante. El 8 de diciembre de 1967 propuso el nombre “La Purísima Concepción”. Perdió a su esposo y a su hijo Isidro.|P',
'Macedonio León Maya|Abuelo materno|† c. 1935|Reclutado por la leva en 1915, domó caballos para el ejército. Agrarista, recibió tierra; fue secuestrado y murió torturado.|F',
'Benito Bocanegra Osornio|Personaje ilustre|1903–1955|Organizó ejidos en Huimilpan y San Cirilo; fue presidente municipal de Pedro Escobedo (1943–1946). Asesinado el 1 de noviembre de 1955.|H',
'José Morales Sánchez|Primer subdelegado|—|El de más edad entre los fundadores (unos 65 años); sabía leer y escribir. Su huerto aportó terreno para la capilla.|P',
'José Carmen Tovar Flores|Memoria histórica|—|Llegó a los 9 años. Sus recuerdos fueron fuente clave del libro, como los “cuicillos” de piedra hallados en su terreno.|P',
'Fraile Aparicio|Franciscano|siglo XIX|Vivió en una choza en el Potrero y cuidó a soldados de ambos bandos; el lugar tomó su nombre.|H',
'Teniente Pancracio|Oficial carrancista|1915|Reclutó a Macedonio pero lo liberó para que volviera a cultivar la tierra.|H',
'Pancho Tinajero|Jefe de bandidos|c. 1917|Lideraba unos 30 hombres de La Sabanilla, Coroneo. Derrotado por los Terrazas; murió fusilado.|H']);
const TL=R(['1820|Nace Vicente Terrazas en Tarjeas, Celaya','1868|Muere Vicente, herido por un bandido','1895|Nace Herculano Terrazas Sánchez','1915|Macedonio León Maya es reclutado por la leva','c. 1917|Los Terrazas derrotan a Pancho Tinajero','1918|Epidemia de tifo','1936|El Ejido de Escolásticas recibe las tierras','1941|Pedro Escobedo se vuelve municipio libre','1947|20 de mayo: llega Herculano y nace La Purísima','1955|Es asesinado Benito Bocanegra','1967|Escuela y nombre “La Purísima Concepción”','1971|Primera misa','1977|Primer molino de nixtamal','1982|Primer tractor y primera camioneta','1984|Llega la luz eléctrica','2012|Las calles reciben nombres de fundadores','2017|Muere Antonio Terrazas Espinoza']);
const LU=R(['Pedro Escobedo|Cabecera municipal; 291 km², a 1,950 msnm','El Potrero de San Aparicio|Antiguo nombre de La Purísima, tierra de la Hacienda de Lagunillas','Cerro del Meco|Hoy Guadalupe Segundo; ahí vivieron Alfonso y Cleta','Lagunillas|Hacienda y pueblo, origen de varios fundadores','Ejido de Escolásticas|1,298 hectáreas repartidas en 1936','Bordos El Zapote y El Sauz|Fuentes de agua para cocinar, lavar y bañarse','Barranca de La Purísima|Cueva con pinturas rupestres','San Cirilo|Donde Benito Bocanegra organizó otro ejido']);
const NA=R(['Plantas|huizache, granjeno, encino, palo dulce, pirul, jara, vara tronadora, nopal y maguey','Animales|zorrillo, tlacuache, coyote, cenzontle, huitlacoche, liebre, conejo, mapache, víbora de cascabel','Cultivos|maíz, frijol, calabaza, alfalfa y hortalizas de huerto familiar']);
const AN=R(['La soga de Estefana|Fingió ahogarse en la oscuridad y burló a los bandidos.','Una botella de tequila|Quien estrena una campana debe invitar tequila a los músicos.','La olla de monedas|Fábula que contaba Alfonso: un calvo sabio ayuda a recuperar un tesoro.','Bartola, la ahorradora|Con oro para comprar una hacienda, pedía huesos en la carnicería.','El camión de dos pisos|Autobús con bancas arriba que iba a Huimilpan solo los domingos.']);
const AU=`Agustín Terrazas León nació en La Purísima, Pedro Escobedo, hijo de Agustín Terrazas Espinoza y María Luisa León Morales; fue el octavo de doce hermanos. A los 29 años ingresó al ejército mexicano, cumpliendo el sueño que su padre no pudo realizar, y se retiró como Subtte. Cond. Ret.|Es el historiador de La Purísima. Propuso poner a las calles los nombres de los fundadores. Casado con Ma. del Carmen Olvera Maya, de Lagunillas, tiene cinco hijos: María Luisa, Agustín, Diego Armando, Efraín y Anayeli; varios siguieron la carrera militar.`;
const M=[['📖','Leer el libro','',book],['👥','Biografías','Personajes y familia',bios],['✍️','El autor','Agustín Terrazas León',autor],['🕰️','Línea del tiempo','1820 a 2017',()=>lst('Línea del tiempo','tl')],['📍','Lugares','Cerros, ejidos, bordos',()=>lst('Lugares','lu')],['🏡','Fundadores','Los 12 hogares',()=>bios('P')],['🌿','Flora y fauna','Naturaleza local',()=>lst('Flora y fauna','na')],['💬','Anécdotas','Historias curiosas',()=>lst('Anécdotas','an')],['🖼️','Fotografías','48 fotos con su descripción',fotos],['📑','Índice','Capítulos del libro',()=>lst('Índice','ix')]];
function V(t,h,back){if(back)history.pushState({},'');$('#v').innerHTML=h;$('#ttl').textContent=t;$('#bb').hidden=!back;$('#v').scrollTop=0}
function home(){V('Historia de La Purísima',`<div class=pad><div class=hero><div class=cv onclick="zoom()" style="cursor:zoom-in;width:150px;height:210px;font-size:9px;border-radius:4px 10px 10px 4px;box-shadow:6px 8px 20px #0006">${covIn}</div></div><div class=grid>${M.map((m,i)=>`<button class=mi onclick="M[${i}][3]()"><span>${m[0]}</span><b>${m[1]}</b><small>${m[2]}</small></button>`).join('')}</div></div>`,0)}
function bios(f){const g=f||'';V(g?'Fundadores':'Biografías',`<div class=pad>${g?'':`<div class=chips>${[['','Todos'],['F','Familia'],['P','Fundadores'],['H','Historia']].map(c=>`<button onclick="bios('${c[0]}')">${c[1]}</button>`).join('')}</div>`}${BI.filter(b=>!g||b[4]==g).map(b=>`<div class=c><div class=av>${b[0].split(' ').slice(0,2).map(w=>w[0]).join('')}</div><div><h3>${b[0]}</h3><em>${b[1]} · ${b[2]}</em><p>${b[3]}</p></div></div>`).join('')}</div>`,1)}
function autor(){V('El autor',`<div class=pad><div class=c style="flex-direction:column"><h3>Subtte. Cond. Ret. Agustín Terrazas León</h3><em>Historiador de La Purísima, Pedro Escobedo, Qro.</em>${AU.split('|').map(p=>`<p>${p}</p>`).join('')}</div></div>`,1)}
